name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux_x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: macos_aarch64
            os: macos-latest
            rust_target: aarch64-apple-darwin
          - target: macos_x86_64
            os: macos-latest
            rust_target: x86_64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.5"

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.15.2" # Match Zig version required by Burrito 1.5.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.rust_target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils p7zip-full

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew install p7zip

      - name: Install Hex & Rebar dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get

      - name: Build release binary
        env:
          MIX_ENV: prod
          BURRITO_TARGET: ${{ matrix.target }}
        run: |
          # Clean tailscale build to ensure correct target NIF is compiled
          mix deps.clean tailscale --build
          mix release

      - name: List outputs
        run: |
          ls -la burrito_out/ || true

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: burrito_out/caudata_${{ matrix.target }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: burrito_out
          pattern: binary-*
          merge-multiple: true

      - name: List downloaded binaries
        run: |
          ls -la burrito_out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            burrito_out/caudata_macos_x86_64
            burrito_out/caudata_macos_aarch64
            burrito_out/caudata_linux_x86_64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
